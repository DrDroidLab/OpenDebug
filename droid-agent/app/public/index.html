<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Droid Agent</title>
  <link rel="icon" type="image/png" href="logo.png">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --font-mono: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', 'Consolas', 'Monaco', monospace;
      --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    }

    [data-theme="dark"] {
      --bg: #0e1116;
      --sidebar: #151a21;
      --card: #1a1f27;
      --card-hover: #20262e;
      --border: #272d36;
      --text: #c9d1d9;
      --text-dim: #7a828a;
      --text-xdim: #4e555d;
      --green: #7ee2a8;
      --green-bg: rgba(126,226,168,0.07);
      --blue: #91c4f2;
      --blue-bg: rgba(145,196,242,0.06);
      --red: #f0918a;
      --red-bg: rgba(240,145,138,0.07);
      --yellow: #e8c872;
      --yellow-bg: rgba(232,200,114,0.07);
      --purple: #c5a5f0;
      --tool-bg: #13171e;
      --tool-border: #222830;
      --tool-output-bg: #0c0f13;
      --input-bg: #0e1116;
      --shadow: rgba(0,0,0,0.3);
      --badge-bg: #272d36;
      --badge-text: #7a828a;
    }

    [data-theme="light"] {
      --bg: #fafbfc;
      --sidebar: #f0f2f5;
      --card: #ebeef2;
      --card-hover: #e2e6eb;
      --border: #d1d6dc;
      --text: #2d333b;
      --text-dim: #6b7280;
      --text-xdim: #9ca3af;
      --green: #3b9e6b;
      --green-bg: rgba(59,158,107,0.06);
      --blue: #4a90c4;
      --blue-bg: rgba(74,144,196,0.06);
      --red: #c75550;
      --red-bg: rgba(199,85,80,0.06);
      --yellow: #a68530;
      --yellow-bg: rgba(166,133,48,0.06);
      --purple: #8b6bbf;
      --tool-bg: #f0f2f5;
      --tool-border: #d1d6dc;
      --tool-output-bg: #fafbfc;
      --input-bg: #ffffff;
      --shadow: rgba(0,0,0,0.06);
      --badge-bg: #d8dde3;
      --badge-text: #6b7280;
    }

    html, body { height: 100%; overflow: hidden; text-align: left; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 12px;
      display: flex;
      transition: background 0.2s, color 0.2s;
      text-align: left;
    }

    /* ── Sidebar ── */
    #sidebar {
      width: 260px;
      min-width: 260px;
      background: var(--sidebar);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    .sidebar-header {
      padding: 16px 14px 12px;
      border-bottom: 1px solid var(--border);
    }

    .sidebar-logo {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }

    .sidebar-logo img { width: 26px; height: 26px; border-radius: 5px; }

    .sidebar-logo h1 {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      font-family: var(--font-mono);
    }

    .sidebar-model {
      font-size: 10px;
      color: var(--text-dim);
      padding: 3px 7px;
      background: var(--card);
      border-radius: 3px;
      display: inline-block;
    }

    .sidebar-nav { flex: 1; overflow-y: auto; padding: 6px 0; }

    .nav-item {
      padding: 8px 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 7px;
      color: var(--text-dim);
      transition: all 0.15s;
      border-left: 2px solid transparent;
      font-size: 11px;
    }
    .nav-item:hover { background: var(--blue-bg); color: var(--text); }
    .nav-item.active { color: var(--green); border-left-color: var(--green); background: var(--green-bg); }

    .nav-icon { font-size: 12px; width: 16px; text-align: center; }

    .nav-badge {
      font-size: 10px;
      background: var(--badge-bg);
      color: var(--badge-text);
      padding: 0px 6px;
      border-radius: 8px;
      margin-left: auto;
      font-weight: 500;
    }

    .nav-divider { height: 1px; background: var(--border); margin: 6px 14px; }

    .history-list { padding: 0; }

    .history-item {
      padding: 4px 14px 4px 36px;
      cursor: pointer;
      color: var(--text-dim);
      font-size: 10px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: all 0.15s;
    }
    .history-item:hover { color: var(--text); background: var(--blue-bg); }
    .history-item.active { color: var(--blue); }

    .history-more {
      padding: 4px 14px 4px 36px;
      cursor: pointer;
      color: var(--blue);
      font-size: 10px;
    }
    .history-more:hover { text-decoration: underline; }

    .sidebar-footer {
      padding: 10px 14px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .sidebar-footer-left {
      font-size: 10px;
      color: var(--text-dim);
      display: flex;
      align-items: center;
    }

    .status-dot {
      display: inline-block;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      margin-right: 5px;
    }
    .status-dot.ok { background: var(--green); }
    .status-dot.err { background: var(--red); }

    .theme-toggle {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 3px 7px;
      cursor: pointer;
      font-size: 11px;
      color: var(--text-dim);
      transition: all 0.15s;
      line-height: 1;
    }
    .theme-toggle:hover { color: var(--text); border-color: var(--text-dim); }

    .new-chat-btn {
      margin: 6px 14px;
      padding: 6px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 5px;
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 11px;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s;
    }
    .new-chat-btn:hover { border-color: var(--green); color: var(--green); }

    .sync-btn {
      margin: 4px 14px 6px;
      padding: 7px 10px;
      background: var(--green-bg);
      border: 1px solid var(--green);
      border-radius: 5px;
      color: var(--green);
      font-family: var(--font-mono);
      font-size: 10px;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s;
      font-weight: 500;
    }
    .sync-btn:hover { background: var(--green); color: var(--bg); }

    /* ── Main area ── */
    #main {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      text-align: left;
    }

    /* ── Detail panel ── */
    #detail-panel {
      display: none;
      flex: 1;
      overflow-y: auto;
      padding: 20px 24px;
    }
    #detail-panel.visible { display: block; }

    .detail-header {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 12px;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .detail-count { font-size: 11px; color: var(--text-dim); font-weight: 400; }

    .detail-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 6px;
      margin-bottom: 8px;
      overflow: hidden;
    }

    .detail-card-header {
      padding: 9px 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      font-weight: 500;
      color: var(--text);
    }
    .detail-card-header:hover { background: var(--card-hover); }

    .detail-card-actions { display: flex; align-items: center; gap: 6px; }

    .detail-card-chevron {
      color: var(--text-dim);
      transition: transform 0.2s;
      font-size: 10px;
    }
    .detail-card.open .detail-card-chevron { transform: rotate(90deg); }

    .detail-card-body {
      display: none;
      padding: 0 12px 10px;
      font-size: 11px;
      color: var(--text-dim);
      line-height: 1.5;
    }
    .detail-card.open .detail-card-body { display: block; }

    .detail-card-body pre {
      background: var(--bg);
      padding: 10px;
      border-radius: 5px;
      overflow-x: auto;
      font-size: 11px;
      white-space: pre-wrap;
      word-break: break-word;
      max-height: 350px;
      overflow-y: auto;
    }
    .detail-card-meta { font-size: 10px; color: var(--text-dim); }

    .edit-btn {
      background: var(--blue-bg);
      border: 1px solid var(--blue);
      border-radius: 3px;
      padding: 2px 8px;
      cursor: pointer;
      font-size: 10px;
      color: var(--blue);
      font-family: var(--font-mono);
      font-weight: 500;
      transition: all 0.15s;
    }
    .edit-btn:hover { background: var(--blue); color: var(--bg); }

    /* ── Modal ── */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .modal {
      background: var(--sidebar);
      border: 1px solid var(--border);
      border-radius: 10px;
      width: 680px;
      max-width: 90vw;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 8px 32px var(--shadow);
    }

    .modal-header {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 600;
      color: var(--text);
    }

    .modal-close {
      background: none;
      border: none;
      color: var(--text-dim);
      font-size: 16px;
      cursor: pointer;
      padding: 2px 6px;
      border-radius: 3px;
    }
    .modal-close:hover { background: var(--card); color: var(--text); }

    .modal-body { flex: 1; overflow: hidden; display: flex; flex-direction: column; }

    .modal-editor {
      flex: 1;
      width: 100%;
      background: var(--bg);
      color: var(--text);
      border: none;
      padding: 12px 16px;
      font-family: var(--font-mono);
      font-size: 11px;
      line-height: 1.5;
      resize: none;
      outline: none;
      min-height: 280px;
    }

    .modal-footer {
      padding: 10px 16px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: flex-end;
      gap: 6px;
    }

    .modal-btn {
      padding: 6px 14px;
      border-radius: 5px;
      font-family: var(--font-mono);
      font-size: 11px;
      cursor: pointer;
      font-weight: 500;
      border: 1px solid var(--border);
      transition: all 0.15s;
    }
    .modal-btn-cancel { background: var(--card); color: var(--text); }
    .modal-btn-cancel:hover { background: var(--card-hover); }
    .modal-btn-save { background: var(--green); color: #fff; border-color: var(--green); }
    .modal-btn-save:hover { opacity: 0.85; }

    /* ── Chat panel ── */
    #chat-panel { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    #chat-panel.hidden { display: none; }

    #messages { flex: 1; overflow-y: auto; padding: 16px 24px; text-align: left; }

    .message { margin-bottom: 18px; text-align: left; }

    .message-pair {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px 16px;
      margin-bottom: 12px;
    }
    .message-pair .message:last-child { margin-bottom: 0; }

    .message-header {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 4px;
    }

    .message-role { font-weight: 600; font-size: 11px; }
    .message-role.user { color: var(--blue); }
    .message-role.assistant { color: var(--green); }
    .message-time { color: var(--text-xdim); font-size: 10px; }

    .message-content, .message-content * { font-size: 12px; line-height: 1.6; color: var(--text); text-align: left; }
    .message-content p { margin-bottom: 6px; }
    .message-content p:last-child { margin-bottom: 0; }
    .message-content code {
      background: var(--card);
      padding: 1px 5px;
      border-radius: 3px;
      font-size: 11px;
      font-family: var(--font-mono);
    }
    .message-content pre {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 10px 12px;
      margin: 6px 0;
      overflow-x: auto;
      font-size: 11px;
    }
    .message-content pre code { background: none; padding: 0; }
    .message-content ul, .message-content ol { padding-left: 18px; margin-bottom: 6px; }
    .message-content li { margin-bottom: 3px; }
    .message-content h1, .message-content h2, .message-content h3 { margin: 10px 0 4px; color: var(--text); font-size: 13px; }
    .message-content a { color: var(--blue); }

    /* ── Tool call blocks ── */
    .tool-block {
      background: var(--tool-bg);
      border: 1px solid var(--tool-border);
      border-radius: 6px;
      margin: 8px 0;
      font-size: 11px;
      overflow: hidden;
    }

    .tool-block-header {
      padding: 7px 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text);
    }
    .tool-block-header:hover { background: var(--card-hover); }

    .tool-block-name {
      color: var(--purple);
      font-weight: 600;
      font-size: 11px;
    }

    .tool-block-args {
      color: var(--text-dim);
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 10px;
    }

    .tool-block-duration {
      color: var(--text-dim);
      font-size: 9px;
      white-space: nowrap;
      background: var(--badge-bg);
      padding: 1px 6px;
      border-radius: 3px;
    }

    .tool-block-spinner {
      display: inline-block;
      width: 11px;
      height: 11px;
      border: 2px solid var(--border);
      border-top-color: var(--green);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .tool-block-body { display: block; padding: 0 12px 10px; }
    .tool-block.collapsed .tool-block-body { display: none; }

    .tool-block-section {
      margin-bottom: 6px;
    }

    .tool-block-section-label {
      font-size: 9px;
      font-weight: 600;
      color: var(--text-xdim);
      text-transform: uppercase;
      letter-spacing: 0.6px;
      margin-bottom: 3px;
    }

    .tool-block-input-label { color: var(--yellow); }
    .tool-block-output-label { color: var(--green); }

    .tool-block-body pre {
      background: var(--tool-output-bg);
      border: 1px solid var(--border);
      padding: 8px 12px;
      border-radius: 4px;
      font-size: 11px;
      white-space: pre-wrap;
      word-break: break-word;
      color: var(--text);
      margin: 0;
      max-height: 500px;
      overflow-y: auto;
      line-height: 1.45;
    }

    .tool-block-chevron {
      color: var(--text-xdim);
      font-size: 9px;
      transition: transform 0.2s;
      transform: rotate(90deg);
    }
    .tool-block.collapsed .tool-block-chevron { transform: rotate(0deg); }

    /* ── Memory write indicator ── */
    .memory-write-indicator {
      font-size: 10px;
      color: var(--green);
      margin: 3px 0;
      padding: 3px 7px;
      background: var(--green-bg);
      border-radius: 3px;
      display: inline-block;
    }

    .thinking-line {
      font-size: 10px;
      color: var(--text-dim);
      font-style: italic;
      margin: 2px 0;
      opacity: 0.7;
    }

    /* ── Feedback buttons ── */
    .feedback-bar { display: flex; gap: 4px; margin-top: 6px; }

    .feedback-btn {
      background: none;
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 3px 7px;
      cursor: pointer;
      font-size: 12px;
      color: var(--text-dim);
      transition: all 0.15s;
      line-height: 1;
      display: flex;
      align-items: center;
    }
    .feedback-btn:hover { background: var(--card); color: var(--text); }
    .feedback-btn.selected { border-color: var(--green); color: var(--green); background: var(--green-bg); }
    .feedback-btn.selected.down { border-color: var(--red); color: var(--red); background: var(--red-bg); }

    /* ── Chat input ── */
    #chat-input-bar {
      padding: 12px 24px 16px;
      border-top: 1px solid var(--border);
      background: var(--sidebar);
    }
    #chat-input-wrap { display: flex; gap: 6px; align-items: flex-end; }

    #chat-input {
      flex: 1;
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 12px;
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 12px;
      resize: none;
      min-height: 36px;
      max-height: 140px;
      outline: none;
      line-height: 1.5;
    }
    #chat-input:focus { border-color: var(--green); }
    #chat-input::placeholder { color: var(--text-xdim); }

    #send-btn {
      background: var(--green);
      border: none;
      border-radius: 6px;
      padding: 8px 14px;
      color: #fff;
      font-family: var(--font-mono);
      font-weight: 600;
      font-size: 11px;
      cursor: pointer;
      white-space: nowrap;
      transition: opacity 0.15s;
    }
    #send-btn:hover { opacity: 0.85; }
    #send-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--text-dim);
      gap: 8px;
    }
    .empty-state-icon { font-size: 32px; opacity: 0.25; }
    .empty-state-text { font-size: 12px; }
    .empty-state-hint { font-size: 10px; opacity: 0.5; }

    .history-detail-item {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 9px 12px;
      margin-bottom: 6px;
      cursor: pointer;
      transition: all 0.15s;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .history-detail-item:hover { border-color: var(--blue); background: var(--blue-bg); }

    .history-detail-title {
      font-size: 11px;
      color: var(--text);
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .history-detail-meta {
      font-size: 10px;
      color: var(--text-dim);
      white-space: nowrap;
      margin-left: 10px;
    }

    /* ── Directory groups ── */
    .dir-group {
      margin-bottom: 12px;
    }

    .dir-group-header {
      padding: 7px 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 6px;
      transition: all 0.15s;
      user-select: none;
    }
    .dir-group-header:hover { background: var(--card-hover); }

    .dir-group-chevron {
      font-size: 9px;
      color: var(--text-dim);
      transition: transform 0.2s;
      transform: rotate(90deg);
    }
    .dir-group.collapsed .dir-group-chevron { transform: rotate(0deg); }

    .dir-group-icon { color: var(--yellow); }

    .dir-group-count {
      font-size: 10px;
      color: var(--text-dim);
      font-weight: 400;
      margin-left: auto;
    }

    .dir-group-body {
      padding: 6px 0 0 16px;
      border-left: 1px solid var(--border);
      margin-left: 10px;
    }
    .dir-group.collapsed .dir-group-body { display: none; }

    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--text-dim); }
  </style>
</head>
<body>
  <aside id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo">
        <img src="logo.png" alt="Droid Agent">
        <h1>Droid Agent</h1>
      </div>
      <div class="sidebar-model" id="model-label">Loading...</div>
    </div>

    <div class="new-chat-btn" id="new-chat-btn">+ New Chat</div>

    <nav class="sidebar-nav">
      <div class="nav-item active" data-section="chat" id="nav-chat">
        <span class="nav-icon">></span> Chat
      </div>

      <div class="nav-divider"></div>

      <div class="nav-item" data-section="skills" id="nav-skills">
        <span class="nav-icon">$</span> Skills
        <span class="nav-badge" id="badge-skills">-</span>
      </div>
      <div class="nav-item" data-section="memory" id="nav-memory">
        <span class="nav-icon">~</span> Memory
        <span class="nav-badge" id="badge-memory">-</span>
      </div>
      <div class="nav-item" data-section="tools" id="nav-tools">
        <span class="nav-icon">#</span> Tools
        <span class="nav-badge" id="badge-tools">-</span>
      </div>

      <div class="nav-divider"></div>

      <div class="nav-item" data-section="history" id="nav-history">
        <span class="nav-icon">@</span> History
        <span class="nav-badge" id="badge-history">-</span>
      </div>
      <div class="history-list" id="history-list"></div>
    </nav>

    <div class="sync-btn" id="sync-btn">Run Infrastructure Sync</div>

    <div class="sidebar-footer">
      <div class="sidebar-footer-left">
        <span class="status-dot ok" id="status-dot"></span>
        <span id="status-text">Connected</span>
      </div>
      <button class="theme-toggle" id="theme-toggle" title="Toggle theme">
        <span id="theme-icon">&#9788;</span>
      </button>
    </div>
  </aside>

  <div id="main">
    <div id="chat-panel">
      <div id="messages">
        <div class="empty-state" id="empty-state">
          <div class="empty-state-icon">_</div>
          <div class="empty-state-text">What's happening in production?</div>
          <div class="empty-state-hint">Paste an error, send a screenshot, or describe the issue</div>
        </div>
      </div>
      <div id="chat-input-bar">
        <div id="chat-input-wrap">
          <textarea id="chat-input" rows="1" placeholder="Describe the issue or paste an error..."></textarea>
          <button id="send-btn">Send</button>
        </div>
      </div>
    </div>

    <div id="detail-panel"></div>
  </div>

  <div id="editor-modal" class="modal-overlay" style="display:none">
    <div class="modal">
      <div class="modal-header">
        <span id="editor-title">Edit</span>
        <button class="modal-close" id="editor-close">&times;</button>
      </div>
      <div class="modal-body">
        <textarea class="modal-editor" id="editor-textarea"></textarea>
      </div>
      <div class="modal-footer">
        <button class="modal-btn modal-btn-cancel" id="editor-cancel">Cancel</button>
        <button class="modal-btn modal-btn-save" id="editor-save">Save</button>
      </div>
    </div>
  </div>

  <script>
    const state = {
      health: null,
      currentView: 'chat',
      conversations: [],
      currentConversationId: null,
      currentMessageId: null,
      isStreaming: false,
      autoScroll: true,
      theme: localStorage.getItem('droid-theme') || 'dark'
    };

    function applyTheme(theme) {
      state.theme = theme;
      document.documentElement.setAttribute('data-theme', theme);
      document.getElementById('theme-icon').innerHTML = theme === 'dark' ? '&#9788;' : '&#9790;';
      localStorage.setItem('droid-theme', theme);
    }
    applyTheme(state.theme);

    marked.setOptions({ gfm: true, breaks: true });

    function renderMd(text) {
      if (!text) return '';
      try { return marked.parse(text); }
      catch { return escapeHtml(text); }
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    const $messages = document.getElementById('messages');
    const $chatPanel = document.getElementById('chat-panel');
    const $detailPanel = document.getElementById('detail-panel');
    const $chatInput = document.getElementById('chat-input');
    const $sendBtn = document.getElementById('send-btn');
    const $modelLabel = document.getElementById('model-label');
    const $historyList = document.getElementById('history-list');
    const $statusDot = document.getElementById('status-dot');
    const $statusText = document.getElementById('status-text');

    async function init() {
      await fetchHealth();
      await fetchRecentHistory();
      updateBadges();
      setupListeners();
      $chatInput.focus();
    }

    async function fetchHealth() {
      try {
        const res = await fetch('/api/health');
        state.health = await res.json();
        $modelLabel.textContent = `${state.health.provider} / ${state.health.model}`;
        $statusDot.className = 'status-dot ok';
        $statusText.textContent = `Redis: ${state.health.redis} | PG: ${state.health.postgres}`;
      } catch {
        $modelLabel.textContent = 'Disconnected';
        $statusDot.className = 'status-dot err';
        $statusText.textContent = 'Connection failed';
      }
    }

    async function updateBadges() {
      try {
        const r = await fetch('/api/skills');
        const d = await r.json();
        document.getElementById('badge-skills').textContent = (d.skills || []).length;
      } catch { document.getElementById('badge-skills').textContent = '?'; }
      try {
        const r = await fetch('/api/memory');
        const d = await r.json();
        document.getElementById('badge-memory').textContent = (d.files || []).length;
      } catch { document.getElementById('badge-memory').textContent = '?'; }
      try {
        const r = await fetch('/api/mcp-servers');
        const d = await r.json();
        const mcpServers = d.servers || [];
        const builtIn = state.health?.toolsAvailable || 0;
        const mcpTools = mcpServers.reduce((s, srv) => s + srv.toolCount, 0);
        const mcpLabel = mcpServers.length > 0 ? ` +${mcpServers.length}mcp` : '';
        document.getElementById('badge-tools').textContent = `${builtIn + mcpTools}${mcpLabel}`;
      } catch {
        if (state.health) {
          document.getElementById('badge-tools').textContent = state.health.toolsAvailable || 0;
        }
      }
    }

    async function fetchRecentHistory() {
      try {
        const res = await fetch('/api/conversations?limit=5');
        const data = await res.json();
        state.conversations = data.conversations || [];
        renderSidebarHistory();
        document.getElementById('badge-history').textContent = state.conversations.length > 0
          ? state.conversations.length + (state.conversations.length >= 5 ? '+' : '')
          : '0';
      } catch { state.conversations = []; }
    }

    function renderSidebarHistory() {
      const list = $historyList;
      list.innerHTML = '';
      for (const conv of state.conversations) {
        const item = document.createElement('div');
        item.className = 'history-item';
        item.textContent = conv.first_message || `Conversation ${conv.id.substring(0, 8)}`;
        item.title = conv.first_message || conv.id;
        item.onclick = () => loadConversation(conv.id);
        list.appendChild(item);
      }
      if (state.conversations.length > 0) {
        const more = document.createElement('div');
        more.className = 'history-more';
        more.textContent = 'More...';
        more.onclick = () => showSection('history');
        list.appendChild(more);
      }
    }

    function setupListeners() {
      document.querySelectorAll('.nav-item').forEach(el => {
        el.addEventListener('click', () => showSection(el.dataset.section));
      });
      document.getElementById('new-chat-btn').addEventListener('click', newChat);
      document.getElementById('sync-btn').addEventListener('click', startSync);
      document.getElementById('theme-toggle').addEventListener('click', () => {
        applyTheme(state.theme === 'dark' ? 'light' : 'dark');
      });
      $sendBtn.addEventListener('click', sendMessage);
      $chatInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
      });
      $chatInput.addEventListener('input', () => {
        $chatInput.style.height = 'auto';
        $chatInput.style.height = Math.min($chatInput.scrollHeight, 140) + 'px';
      });
      $messages.addEventListener('scroll', () => {
        const { scrollTop, scrollHeight, clientHeight } = $messages;
        state.autoScroll = scrollHeight - scrollTop - clientHeight < 50;
      });
      document.getElementById('editor-close').addEventListener('click', closeEditor);
      document.getElementById('editor-cancel').addEventListener('click', closeEditor);
      document.getElementById('editor-modal').addEventListener('click', (e) => {
        if (e.target === e.currentTarget) closeEditor();
      });
    }

    function showSection(section) {
      state.currentView = section;
      document.querySelectorAll('.nav-item').forEach(el => {
        el.classList.toggle('active', el.dataset.section === section);
      });
      if (section === 'chat') {
        $chatPanel.classList.remove('hidden');
        $detailPanel.classList.remove('visible');
        $chatInput.focus();
      } else {
        $chatPanel.classList.add('hidden');
        $detailPanel.classList.add('visible');
        if (section === 'skills') loadSkills();
        else if (section === 'memory') loadMemory();
        else if (section === 'tools') loadTools();
        else if (section === 'history') loadHistory();
      }
    }

    function newChat() {
      state.currentConversationId = null;
      state.currentMessageId = null;
      $messages.innerHTML = `
        <div class="empty-state" id="empty-state">
          <div class="empty-state-icon">_</div>
          <div class="empty-state-text">What's happening in production?</div>
          <div class="empty-state-hint">Paste an error, send a screenshot, or describe the issue</div>
        </div>`;
      showSection('chat');
    }

    // ── Editor modal ──
    let editorCallback = null;

    function openEditor(title, content, onSave) {
      document.getElementById('editor-title').textContent = title;
      document.getElementById('editor-textarea').value = content;
      document.getElementById('editor-modal').style.display = 'flex';
      editorCallback = onSave;
      document.getElementById('editor-save').onclick = async () => {
        const newContent = document.getElementById('editor-textarea').value;
        document.getElementById('editor-save').disabled = true;
        document.getElementById('editor-save').textContent = 'Saving...';
        try {
          await onSave(newContent);
          closeEditor();
          if (state.currentView === 'skills') loadSkills();
          else if (state.currentView === 'memory') loadMemory();
          updateBadges();
        } catch (err) { alert('Save failed: ' + err.message); }
        document.getElementById('editor-save').disabled = false;
        document.getElementById('editor-save').textContent = 'Save';
      };
      setTimeout(() => document.getElementById('editor-textarea').focus(), 50);
    }

    function closeEditor() {
      document.getElementById('editor-modal').style.display = 'none';
      editorCallback = null;
    }

    // ── Detail panels ──

    async function loadSkills() {
      $detailPanel.innerHTML = '<div class="detail-header">$ Skills <span class="detail-count">loading...</span></div>';
      try {
        const res = await fetch('/api/skills');
        const data = await res.json();
        const skills = data.skills || [];
        let html = `<div class="detail-header">$ Skills <span class="detail-count">(${skills.length})</span></div>`;
        for (let i = 0; i < skills.length; i++) {
          const skill = skills[i];
          html += `
            <div class="detail-card" id="skill-card-${i}">
              <div class="detail-card-header" onclick="this.parentElement.classList.toggle('open')">
                <span>${escapeHtml(skill.name)}</span>
                <div class="detail-card-actions">
                  <button class="edit-btn" onclick="event.stopPropagation(); editSkill('${escapeHtml(skill.name)}')">Edit</button>
                  <span class="detail-card-chevron">&#9654;</span>
                </div>
              </div>
              <div class="detail-card-body"><pre>${escapeHtml(skill.content)}</pre></div>
            </div>`;
        }
        if (skills.length === 0) html += '<div style="color:var(--text-dim)">No skills loaded</div>';
        $detailPanel.innerHTML = html;
      } catch (err) {
        $detailPanel.innerHTML = `<div class="detail-header">$ Skills</div><div style="color:var(--red)">Failed to load: ${escapeHtml(err.message)}</div>`;
      }
    }

    async function editSkill(name) {
      const res = await fetch('/api/skills');
      const data = await res.json();
      const skill = (data.skills || []).find(s => s.name === name);
      if (!skill) return alert('Skill not found');
      openEditor(`Edit Skill: ${name}`, skill.content, async (newContent) => {
        const r = await fetch(`/api/skills/${encodeURIComponent(name)}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ content: newContent })
        });
        if (!r.ok) throw new Error((await r.json()).error || 'Failed');
      });
    }

    async function loadMemory() {
      $detailPanel.innerHTML = '<div class="detail-header">~ Memory <span class="detail-count">loading...</span></div>';
      try {
        const res = await fetch('/api/memory');
        const data = await res.json();
        const files = data.files || [];

        // Group by directory
        const groups = {};
        for (const file of files) {
          const slashIdx = file.path.indexOf('/');
          const dir = slashIdx !== -1 ? file.path.substring(0, slashIdx) : '/';
          if (!groups[dir]) groups[dir] = [];
          groups[dir].push(file);
        }

        let html = `<div class="detail-header">~ Memory <span class="detail-count">(${files.length} files)</span></div>`;

        // Sort directories: root last, then alphabetical
        const dirOrder = Object.keys(groups).sort((a, b) => {
          if (a === '/') return 1;
          if (b === '/') return -1;
          return a.localeCompare(b);
        });

        for (const dir of dirOrder) {
          const dirFiles = groups[dir];
          const dirLabel = dir === '/' ? 'Root' : dir;

          html += `<div class="dir-group">`;
          html += `<div class="dir-group-header" onclick="this.parentElement.classList.toggle('collapsed')">
            <span class="dir-group-chevron">&#9654;</span>
            <span class="dir-group-icon">&#128193;</span>
            <span>${escapeHtml(dirLabel)}</span>
            <span class="dir-group-count">${dirFiles.length} file${dirFiles.length !== 1 ? 's' : ''}</span>
          </div>`;
          html += `<div class="dir-group-body">`;

          for (const file of dirFiles) {
            const fileName = dir === '/' ? file.path : file.path.substring(dir.length + 1);
            const sizeLabel = file.size ? `${file.size}b` : '';
            const safePath = escapeHtml(file.path);
            html += `
              <div class="detail-card">
                <div class="detail-card-header" onclick="this.parentElement.classList.toggle('open')">
                  <span>${escapeHtml(fileName)}</span>
                  <div class="detail-card-actions">
                    <span class="detail-card-meta">${sizeLabel}</span>
                    <button class="edit-btn" onclick="event.stopPropagation(); editMemory('${safePath}')">Edit</button>
                    <span class="detail-card-chevron">&#9654;</span>
                  </div>
                </div>
                <div class="detail-card-body"><pre>${escapeHtml(file.content)}</pre></div>
              </div>`;
          }

          html += `</div></div>`;
        }

        if (files.length === 0) html += '<div style="color:var(--text-dim)">No memory files. Run Infrastructure Sync to populate.</div>';
        $detailPanel.innerHTML = html;
      } catch (err) {
        $detailPanel.innerHTML = `<div class="detail-header">~ Memory</div><div style="color:var(--red)">Failed to load: ${escapeHtml(err.message)}</div>`;
      }
    }

    async function editMemory(path) {
      const res = await fetch('/api/memory');
      const data = await res.json();
      const file = (data.files || []).find(f => f.path === path);
      if (!file) return alert('File not found');
      openEditor(`Edit Memory: ${path}`, file.content, async (newContent) => {
        const r = await fetch('/api/memory/write', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ path, content: newContent })
        });
        if (!r.ok) throw new Error((await r.json()).error || 'Failed');
      });
    }

    async function loadTools() {
      $detailPanel.innerHTML = '<div class="detail-header"># Tools <span class="detail-count">loading...</span></div>';
      try {
        const [toolsRes, mcpRes] = await Promise.all([
          fetch('/api/tools'),
          fetch('/api/mcp-servers').catch(() => null)
        ]);
        const toolsData = await toolsRes.json();
        const tools = toolsData.tools || [];
        const mcpData = mcpRes ? await mcpRes.json() : { servers: [] };
        const mcpServers = mcpData.servers || [];

        const totalMcpTools = mcpServers.reduce((s, srv) => s + srv.toolCount, 0);
        let html = `<div class="detail-header"># Tools <span class="detail-count">(${tools.length} built-in, ${mcpServers.length} MCP server${mcpServers.length !== 1 ? 's' : ''})</span></div>`;

        // Built-in tools
        html += `<div style="font-size:11px;font-weight:600;color:var(--text-dim);margin:8px 0 6px;text-transform:uppercase;letter-spacing:0.5px">Built-in Tools</div>`;
        for (const tool of tools) {
          const params = tool.parameters ? JSON.stringify(tool.parameters, null, 2) : 'No parameters';
          html += `
            <div class="detail-card" onclick="this.classList.toggle('open')">
              <div class="detail-card-header">
                <span>${escapeHtml(tool.name)}</span>
                <span class="detail-card-chevron">&#9654;</span>
              </div>
              <div class="detail-card-body">
                <p style="margin-bottom:6px;color:var(--text)">${escapeHtml(tool.description || '')}</p>
                <pre>${escapeHtml(params)}</pre>
              </div>
            </div>`;
        }

        // MCP servers section
        if (mcpServers.length > 0) {
          html += `<div style="font-size:11px;font-weight:600;color:var(--text-dim);margin:16px 0 6px;text-transform:uppercase;letter-spacing:0.5px">MCP Server Tools</div>`;

          for (const srv of mcpServers) {
            const statusColor = srv.status === 'connected' ? 'var(--green)' : 'var(--red)';
            const statusLabel = srv.status === 'connected' ? 'Connected' : 'Failed';
            const statusDot = srv.status === 'connected' ? '&#9679;' : '&#9679;';

            html += `<div class="dir-group">`;
            html += `<div class="dir-group-header" onclick="this.parentElement.classList.toggle('collapsed')">
              <span class="dir-group-chevron">&#9654;</span>
              <span style="color:${statusColor};font-size:10px">${statusDot}</span>
              <span>${escapeHtml(srv.name)}</span>
              <span style="font-size:10px;color:var(--text-dim);font-weight:400">${srv.type}</span>
              <span class="dir-group-count">${srv.status === 'connected' ? srv.toolCount + ' tool' + (srv.toolCount !== 1 ? 's' : '') : statusLabel + (srv.error ? ': ' + srv.error : '')}</span>
            </div>`;
            html += `<div class="dir-group-body">`;

            if (srv.tools.length > 0) {
              for (const tool of srv.tools) {
                const schema = tool.inputSchema ? JSON.stringify(tool.inputSchema.properties || {}, null, 2) : 'No parameters';
                html += `
                  <div class="detail-card" onclick="this.classList.toggle('open')">
                    <div class="detail-card-header">
                      <span>${escapeHtml(tool.name)}</span>
                      <span class="detail-card-chevron">&#9654;</span>
                    </div>
                    <div class="detail-card-body">
                      <p style="margin-bottom:6px;color:var(--text)">${escapeHtml(tool.description || '')}</p>
                      <pre>${escapeHtml(schema)}</pre>
                    </div>
                  </div>`;
              }
            } else if (srv.status !== 'connected') {
              html += `<div style="color:var(--text-dim);font-size:10px;padding:4px 0">Server not connected — no tools available</div>`;
            } else {
              html += `<div style="color:var(--text-dim);font-size:10px;padding:4px 0">No tools registered</div>`;
            }

            html += `</div></div>`;
          }
        }

        if (tools.length === 0 && mcpServers.length === 0) html += '<div style="color:var(--text-dim)">No tools configured</div>';
        $detailPanel.innerHTML = html;
      } catch (err) {
        $detailPanel.innerHTML = `<div class="detail-header"># Tools</div><div style="color:var(--red)">Failed to load: ${escapeHtml(err.message)}</div>`;
      }
    }

    async function loadHistory() {
      $detailPanel.innerHTML = '<div class="detail-header">@ History <span class="detail-count">loading...</span></div>';
      try {
        const res = await fetch('/api/conversations?limit=50');
        const data = await res.json();
        const convs = data.conversations || [];
        document.getElementById('badge-history').textContent = convs.length;
        let html = `<div class="detail-header">@ History <span class="detail-count">(${convs.length} conversations)</span></div>`;
        for (const conv of convs) {
          const title = conv.first_message || `Conversation ${conv.id.substring(0, 8)}`;
          const date = conv.last_active_at ? new Date(conv.last_active_at).toLocaleString() : '';
          const meta = `${conv.message_count || 0} msgs | ${conv.tools_used || 0} tools | ${date}`;
          html += `
            <div class="history-detail-item" onclick="loadConversation('${conv.id}')">
              <div class="history-detail-title">${escapeHtml(title)}</div>
              <div class="history-detail-meta">${escapeHtml(meta)}</div>
            </div>`;
        }
        if (convs.length === 0) html += '<div style="color:var(--text-dim)">No conversations yet</div>';
        $detailPanel.innerHTML = html;
      } catch (err) {
        $detailPanel.innerHTML = `<div class="detail-header">@ History</div><div style="color:var(--red)">Failed to load: ${escapeHtml(err.message)}</div>`;
      }
    }

    async function loadConversation(convId) {
      state.currentConversationId = convId;
      showSection('chat');
      $messages.innerHTML = '<div class="thinking-line">Loading conversation...</div>';
      try {
        const res = await fetch(`/api/conversations/${convId}/messages`);
        const data = await res.json();
        const msgs = data.messages || [];
        $messages.innerHTML = '';
        for (const msg of msgs) {
          if (msg.role === 'user') {
            appendUserMessage(msg.content);
          } else if (msg.role === 'assistant') {
            const container = appendAssistantMessage();
            if (msg.tool_details) {
              let toolDetails = msg.tool_details;
              if (typeof toolDetails === 'string') {
                try { toolDetails = JSON.parse(toolDetails); } catch { toolDetails = []; }
              }
              for (const td of toolDetails) {
                appendToolBlock(container, td.tool, td.args, td.result, td.duration);
              }
            }
            const contentEl = container.querySelector('.message-content');
            contentEl.innerHTML = renderMd(msg.content);
            appendFeedback(container, msg.id, convId, msg.feedback);
          }
        }
        scrollToBottom();
      } catch (err) {
        $messages.innerHTML = `<div style="color:var(--red)">Failed to load conversation: ${escapeHtml(err.message)}</div>`;
      }
      document.querySelectorAll('.history-item').forEach(el => el.classList.remove('active'));
    }

    async function sendMessage() {
      const text = $chatInput.value.trim();
      if (!text || state.isStreaming) return;
      state.isStreaming = true;
      $sendBtn.disabled = true;
      $chatInput.value = '';
      $chatInput.style.height = 'auto';

      const emptyEl = document.getElementById('empty-state');
      if (emptyEl) emptyEl.remove();

      appendUserMessage(text);
      const container = appendAssistantMessage();
      const contentEl = container.querySelector('.message-content');
      const thinkingEl = document.createElement('div');
      thinkingEl.className = 'thinking-line';
      thinkingEl.textContent = 'Thinking...';
      container.insertBefore(thinkingEl, contentEl);
      state.autoScroll = true;
      scrollToBottom();

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            message: text,
            conversationId: state.currentConversationId || (state.currentConversationId = generateId())
          })
        });
        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          const parts = buffer.split('\n\n');
          buffer = parts.pop();
          for (const part of parts) {
            const lines = part.split('\n');
            for (const line of lines) {
              if (!line.startsWith('data: ')) continue;
              try {
                const event = JSON.parse(line.slice(6));
                handleSSE(event, container, thinkingEl, contentEl);
              } catch {}
            }
          }
        }
      } catch (err) {
        contentEl.innerHTML = `<span style="color:var(--red)">Error: ${escapeHtml(err.message)}</span>`;
      }

      if (thinkingEl.parentNode) thinkingEl.remove();
      state.isStreaming = false;
      $sendBtn.disabled = false;
      $chatInput.focus();
      scrollToBottom();
      fetchRecentHistory();
      updateBadges();
    }

    function handleSSE(event, container, thinkingEl, contentEl) {
      switch (event.type) {
        case 'thinking':
          thinkingEl.textContent = event.message || 'Thinking...';
          break;
        case 'tool_call':
          appendToolBlock(container, event.tool, event.args, null, null, true);
          break;
        case 'tool_result': {
          const blocks = container.querySelectorAll('.tool-block');
          for (let i = blocks.length - 1; i >= 0; i--) {
            const block = blocks[i];
            if (block.dataset.tool === event.tool && !block.dataset.done) {
              block.dataset.done = '1';
              const durEl = block.querySelector('.tool-block-duration');
              if (durEl) {
                durEl.textContent = event.duration ? `${(event.duration/1000).toFixed(1)}s` : '';
                durEl.style.display = event.duration ? '' : 'none';
              }
              const spinEl = block.querySelector('.tool-block-spinner');
              if (spinEl) spinEl.remove();
              const outputPre = block.querySelector('.tool-output-pre');
              if (outputPre && event.preview) outputPre.textContent = event.preview;
              break;
            }
          }
          break;
        }
        case 'memory_write': {
          const mwEl = document.createElement('div');
          mwEl.className = 'memory-write-indicator';
          mwEl.textContent = `Saved: memory/${event.path || ''}`;
          container.insertBefore(mwEl, contentEl);
          break;
        }
        case 'response':
          if (event.text) contentEl.innerHTML = renderMd(event.text);
          break;
        case 'final':
          if (event.response) contentEl.innerHTML = renderMd(event.response);
          state.currentConversationId = event.conversationId || state.currentConversationId;
          state.currentMessageId = event.messageId;
          if (thinkingEl.parentNode) thinkingEl.remove();
          appendFeedback(container, event.messageId, event.conversationId);
          break;
        case 'error': {
          const errEl = document.createElement('div');
          errEl.style.color = 'var(--red)';
          errEl.textContent = event.message || 'An error occurred';
          container.insertBefore(errEl, contentEl);
          break;
        }
        case 'model_output':
        case 'done':
          break;
      }
      if (state.autoScroll) scrollToBottom();
    }

    function appendUserMessage(text) {
      const pair = document.createElement('div');
      pair.className = 'message-pair';
      pair.id = 'current-pair';

      const el = document.createElement('div');
      el.className = 'message';
      el.innerHTML = `
        <div class="message-header">
          <span class="message-role user">You</span>
          <span class="message-time">${timeNow()}</span>
        </div>
        <div class="message-content">${escapeHtml(text)}</div>`;
      pair.appendChild(el);
      $messages.appendChild(pair);
    }

    function appendAssistantMessage() {
      const el = document.createElement('div');
      el.className = 'message';
      el.innerHTML = `
        <div class="message-header">
          <span class="message-role assistant">Droid Agent</span>
          <span class="message-time">${timeNow()}</span>
        </div>
        <div class="message-content"></div>`;

      // Add to the current pair if it exists
      const pair = document.getElementById('current-pair');
      if (pair) {
        pair.appendChild(el);
        pair.removeAttribute('id');
      } else {
        // Standalone (e.g., loading history)
        const wrapper = document.createElement('div');
        wrapper.className = 'message-pair';
        wrapper.appendChild(el);
        $messages.appendChild(wrapper);
      }
      return el;
    }

    function appendToolBlock(container, toolName, args, result, duration, isRunning) {
      const contentEl = container.querySelector('.message-content');
      const block = document.createElement('div');
      block.className = 'tool-block';
      block.dataset.tool = toolName || '';

      const argsStr = typeof args === 'string' ? args : (args ? JSON.stringify(args, null, 2) : '');
      const argsSummary = typeof args === 'string' ? args : (args?.command || args?.url || args?.path || '');
      const durStr = duration ? `${(duration/1000).toFixed(1)}s` : '';

      block.innerHTML = `
        <div class="tool-block-header" onclick="this.parentElement.classList.toggle('collapsed')">
          <span class="tool-block-chevron">&#9654;</span>
          <span class="tool-block-name">${escapeHtml(toolName || '')}</span>
          <span class="tool-block-args">${escapeHtml(argsSummary)}</span>
          ${isRunning ? '<span class="tool-block-spinner"></span>' : ''}
          <span class="tool-block-duration" ${!durStr ? 'style="display:none"' : ''}>${durStr}</span>
        </div>
        <div class="tool-block-body">
          <div class="tool-block-section">
            <div class="tool-block-section-label tool-block-input-label">Input</div>
            <pre>${escapeHtml(argsStr)}</pre>
          </div>
          <div class="tool-block-section">
            <div class="tool-block-section-label tool-block-output-label">Output</div>
            <pre class="tool-output-pre">${escapeHtml(result || (isRunning ? 'Running...' : ''))}</pre>
          </div>
        </div>`;

      container.insertBefore(block, contentEl);
      return block;
    }

    function appendFeedback(container, messageId, conversationId, existingFeedback) {
      if (!messageId) return;
      const bar = document.createElement('div');
      bar.className = 'feedback-bar';

      const upBtn = document.createElement('button');
      upBtn.className = 'feedback-btn' + (existingFeedback === 'up' ? ' selected' : '');
      upBtn.innerHTML = '&#128077;';
      upBtn.title = 'Helpful';

      const downBtn = document.createElement('button');
      downBtn.className = 'feedback-btn' + (existingFeedback === 'down' ? ' selected down' : '');
      downBtn.innerHTML = '&#128078;';
      downBtn.title = 'Not helpful';

      async function sendFeedback(fb) {
        try {
          await fetch('/api/feedback', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ messageId, conversationId, feedback: fb })
          });
          upBtn.className = 'feedback-btn' + (fb === 'up' ? ' selected' : '');
          downBtn.className = 'feedback-btn' + (fb === 'down' ? ' selected down' : '');
        } catch {}
      }

      upBtn.onclick = () => sendFeedback('up');
      downBtn.onclick = () => sendFeedback('down');
      bar.appendChild(upBtn);
      bar.appendChild(downBtn);
      container.appendChild(bar);
    }

    async function startSync() {
      showSection('chat');
      const emptyEl = document.getElementById('empty-state');
      if (emptyEl) emptyEl.remove();

      appendUserMessage('Starting Infrastructure Sync...');
      const container = appendAssistantMessage();
      const contentEl = container.querySelector('.message-content');
      const thinkingEl = document.createElement('div');
      thinkingEl.className = 'thinking-line';
      thinkingEl.textContent = 'Syncing infrastructure...';
      container.insertBefore(thinkingEl, contentEl);
      state.autoScroll = true;
      scrollToBottom();

      try {
        const res = await fetch('/api/sync', { method: 'POST' });
        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          const parts = buffer.split('\n\n');
          buffer = parts.pop();
          for (const part of parts) {
            const lines = part.split('\n');
            for (const line of lines) {
              if (!line.startsWith('data: ')) continue;
              try {
                const event = JSON.parse(line.slice(6));
                handleSSE(event, container, thinkingEl, contentEl);
                if (event.type === 'done') {
                  if (thinkingEl.parentNode) thinkingEl.remove();
                  contentEl.innerHTML = renderMd(`Infrastructure sync complete. Files written: ${(event.filesWritten || []).join(', ') || 'none'}`);
                }
              } catch {}
            }
          }
        }
      } catch (err) {
        contentEl.innerHTML = `<span style="color:var(--red)">Sync failed: ${escapeHtml(err.message)}</span>`;
      }
      if (thinkingEl.parentNode) thinkingEl.remove();
      scrollToBottom();
      updateBadges();
    }

    function generateId() {
      return Date.now().toString(36) + '-' + Math.random().toString(36).substring(2, 9);
    }

    function timeNow() {
      return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    function scrollToBottom() {
      requestAnimationFrame(() => { $messages.scrollTop = $messages.scrollHeight; });
    }

    init();
  </script>
</body>
</html>
